<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Магазин Техніки — Кошик</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="container header-content"><a href="main.html" class="logo">Магазин Техніки</a><button class="menu-toggle" type="button" aria-label="Відкрити меню" aria-expanded="false">☰ Меню</button><nav class="nav-menu"><a href="main.html">Головна</a><a href="catalog.html">Каталог</a><a href="cart.html" class="active">Кошик</a></nav></div></header>
<main class="container"><h1>Ваш кошик</h1><p>Тут зібрані товари, які ви додали до кошика.</p><section class="cart-layout"><div class="cart-items" id="cart-items"><p>Завантаження кошика...</p></div>
<aside class="summary"><h2>Підсумок</h2><p>Товари: <span id="summary-count">0</span> шт</p><h3>Загальна сума: <span id="summary">0</span> грн</h3><button type="button" class="button" id="open-order-form">Оформити замовлення</button> <a href="catalog.html" class="button secondary">Продовжити покупки</a>
<div id="order-form-container" hidden><h2>Оформлення замовлення</h2><form id="order-form"><label for="customer-name">Ваше ім'я:</label><input type="text" id="customer-name" minlength="2" maxlength="80" required placeholder="Ваше ім'я"><label for="customer-phone">Номер телефону:</label><input type="tel" id="customer-phone" required placeholder="+380XXXXXXXXX"><label for="customer-address">Адреса доставки:</label><input type="text" id="customer-address" minlength="5" maxlength="200" required placeholder="Ваша адреса"><button type="submit">Підтвердити замовлення</button><button type="button" id="close-order-form">Скасувати</button><p id="form-message" role="status" aria-live="polite"></p></form></div></aside></section></main><script src="script.js" defer></script></body></html>
