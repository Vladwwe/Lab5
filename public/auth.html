<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Вхід і реєстрація — TECH STORE</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="container header-content"><a href="main.html" class="logo">Магазин Техніки</a><button class="menu-toggle" type="button" aria-label="Відкрити меню" aria-expanded="false">☰ Меню</button><nav class="nav-menu"><a href="main.html">Головна</a><a href="catalog.html">Каталог</a><a href="cart.html">Кошик</a></nav></div></header>
<main class="container auth-wrap"><section class="auth-card"><p class="eyebrow">TECH STORE</p><h1 id="auth-title">Вхід до кабінету</h1><p class="muted">Увійдіть, щоб переглядати свої замовлення та оформлювати покупки.</p><div class="auth-tabs"><button type="button" class="selected" data-auth-mode="login">Увійти</button><button type="button" data-auth-mode="register">Реєстрація</button></div>
<form id="auth-form"><div id="auth-name-field" hidden><label for="auth-name">Ваше ім'я</label><input id="auth-name" type="text" minlength="2" maxlength="60" placeholder="Ім'я"></div><label for="auth-email">Електронна пошта</label><input id="auth-email" type="email" required maxlength="120" autocomplete="email" placeholder="name@example.com"><label for="auth-password">Пароль</label><input id="auth-password" type="password" required minlength="8" maxlength="72" autocomplete="current-password" placeholder="Мінімум 8 символів"><button id="auth-submit" class="button auth-submit" type="submit">Увійти</button><p id="auth-message" class="form-message" role="status" aria-live="polite"></p></form><p class="muted small">Під час реєстрації пароль зберігається у вигляді захищеного хешу.</p></section></main><script src="script.js" defer></script></body></html>
